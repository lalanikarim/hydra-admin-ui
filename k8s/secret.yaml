# Hydra Admin Auth Secret
# Create with: kubectl create secret generic hydra-admin-auth \
#   --from-literal=admin-token="$(openssl rand -hex 32)" \
#   --from-literal=totp-secret="$(node -e "console.log(require('otplib').generateSecret({length:20}))")"
#
# OR apply this file after filling in the values:
apiVersion: v1
kind: Secret
metadata:
  name: hydra-admin-auth
  labels:
    app: hydra-admin
type: Opaque
stringData:
  # Generate: openssl rand -hex 32
  admin-token: "CHANGE_ME"
  # Generate: node -e "console.log(require('otplib').generateSecret({length:20}))"
  # Then scan the otpauth URI in your authenticator app:
  # otpauth://totp/HydraAdmin:admin?secret=<this-value>&issuer=HydraAdmin
  totp-secret: "CHANGE_ME"
