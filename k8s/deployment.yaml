apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra-admin
  labels:
    app: hydra-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hydra-admin
  template:
    metadata:
      labels:
        app: hydra-admin
    spec:
      containers:
        - name: hydra-admin
          image: hydra-admin:latest
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: HYDRA_ADMIN_URL
              value: "http://hydra-admin.ory.svc.cluster.local:4445"
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: SESSION_HOURS
              value: "8"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hydra-admin-auth
                  key: admin-token
            - name: ADMIN_TOTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: hydra-admin-auth
                  key: totp-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: hydra-admin
  labels:
    app: hydra-admin
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: hydra-admin
