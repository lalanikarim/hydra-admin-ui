{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hydra-admin.fullname" . }}-ingress
  labels:
    {{- include "hydra-admin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hydra-admin.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.allowNamespaces }}
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- range .Values.networkPolicy.allowNamespaces }}
                  - {{ . | quote }}
                  {{- end }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.allowPodSelector }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowPodSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
    {{- end }}
    {{- if and (not .Values.networkPolicy.allowNamespaces) (not .Values.networkPolicy.allowPodSelector) }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "hydra-admin.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
    {{- end }}
{{- end }}
